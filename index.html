<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e9e5df">
  <title>Save the Date | Rocío Jazmín Cortez Vázquez & José Manuel Jiménez Martínez</title>
  <style>
    :root { --ink:#222; --paper:#eeeae4; --button:#272727; }
    * { box-sizing:border-box; }
    html, body { margin:0; min-height:100%; background:var(--paper); }
    body { font-family: Georgia, 'Times New Roman', serif; color:var(--ink); }
    .invitation { min-height:100svh; display:grid; place-items:center; position:relative; overflow:hidden; }
    .art { width:min(100vw, 560px); height:100svh; max-height:1000px; object-fit:cover; display:block; }
    .veil { position:absolute; inset:0; display:grid; place-items:center; background:rgba(255,255,255,.04); transition:opacity .35s ease; }
    .veil.hidden { opacity:0; pointer-events:none; }
    .listen { border:0; border-radius:999px; padding:14px 22px; background:rgba(35,35,35,.88); color:white; font:600 12px/1 Arial,sans-serif; letter-spacing:.18em; cursor:pointer; box-shadow:0 6px 24px rgba(0,0,0,.18); }
    .controls { position:absolute; left:50%; bottom:max(18px, env(safe-area-inset-bottom)); transform:translateX(-50%); width:min(88vw, 390px); display:flex; gap:10px; justify-content:center; }
    .action { text-decoration:none; text-align:center; border-radius:999px; padding:13px 17px; font:700 11px/1 Arial,sans-serif; letter-spacing:.12em; color:#fff; background:var(--button); box-shadow:0 5px 20px rgba(0,0,0,.2); }
    .action.music { background:#756b61; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    @media (max-width:420px) { .controls { flex-direction:column; width:62vw; } .action { padding:12px 10px; } }
  </style>
</head>
<body>
  <main class="invitation" id="invitation" aria-label="Save the Date para la boda de Rocío Jazmín Cortez Vázquez y José Manuel Jiménez Martínez">
    <img class="art" src="invitacion.png" alt="Save the Date para la boda de Rocío Jazmín Cortez Vázquez y José Manuel Jiménez Martínez con tulipanes blancos">
    <div class="veil" id="veil">
      <button class="listen" id="listen" type="button">TOCA PARA ESCUCHAR</button>
    </div>
    <div class="controls">
      <a class="action" href="https://wa.me/524493868489?text=Hola%2C%20confirmo%20mi%20asistencia%20a%20la%20boda%20de%20Roc%C3%ADo%20Jazm%C3%ADn%20y%20Jos%C3%A9%20Manuel.%20Mi%20nombre%20es%3A%20" target="_blank" rel="noopener">CONFIRMAR ASISTENCIA</a>
      <button class="action music" id="musicButton" type="button">♫ ESCUCHAR MÚSICA</button>
    </div>
    <audio id="audio" src="cancion.mp3" preload="auto" loop autoplay></audio>
  </main>
  <script>
    const audio = document.getElementById('audio');
    const veil = document.getElementById('veil');
    const listen = document.getElementById('listen');
    const musicButton = document.getElementById('musicButton');
    async function startAudio() {
      try { await audio.play(); veil.classList.add('hidden'); }
      catch (_) { veil.classList.remove('hidden'); }
    }
    listen.addEventListener('click', startAudio);
    musicButton.addEventListener('click', startAudio);
    document.getElementById('invitation').addEventListener('pointerdown', startAudio, { once:true });
    window.addEventListener('load', startAudio);
  </script>
</body>
</html>
